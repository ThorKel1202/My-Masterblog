<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    {% if posts %}
        {% for post in posts %}
            <div class="post">
                <h2>{{ post.title }}</h2>
                <p><em>Written by {{ post.author }}</em></p>
                <p>{{ post.content }}</p>
                <p>
                    <!--<a href="{{ url_for('like', post_id=post.id) }}">
                        👍 Like
                    </a>
                    <button type="button"
                            onclick="window.location.href='{{ url_for('like', post_id=post.id) }}'">
                        👍 Like post
                    </button> -->
                    <button type="button"
                            onclick="window.location.href='{{ url_for('like', post_id=post.id) }}'">
                        ❤️ Likes: {{ post.likes or 0 }}
                    </button>
                    <!-- Edit Button -->
                    <button type="button"
                            onclick="window.location.href='{{ url_for('update', post_id=post.id) }}'">
                        ✏️ Edit post
                    </button>
                    <!-- Delete Button -->
                    <button type="button"
                            onclick="window.location.href='{{ url_for('delete', post_id=post.id) }}'">
                        🗑️ Delete post
                    </button>
                </p>
            </div>
        {% endfor %}
    {% else %}
        <p>No posts available.</p>
    {% endif %}
    <p>
        <button type="button" onclick="window.location.href='{{ url_for('add') }}'">
            ➕ Create a new post here
        </button>
    </p>
</body>
</html>
