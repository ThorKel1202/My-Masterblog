<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a new post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Create a new blog post!</h1>

    <div class="post">
        <form method="POST" action="{{ url_for('add') }}">

            <p>
                <label for="title"><strong>Title</strong></label><br>
                <input type="text" id="title" name="title" required style="width: 100%;">
            </p>

            <p>
                <label for="author"><strong>Author</strong></label><br>
                <input type="text" id="author" name="author" required style="width: 100%;">
            </p>

            <p>
                <label for="content"><strong>Content</strong></label><br>
                <textarea id="content" name="content" rows="6" required style="width: 100%;"></textarea>
            </p>

            <p>
                <button type="submit">💾 Save post</button>
                <a href="{{ url_for('index') }}" style="margin-left: 10px;"></a>
                <button type="button" onclick="window.location.href='{{ url_for('index') }}'">
                    🔁 Back to Index
                </button>
            </p>

        </form>
    </div>

</body>
</html>
